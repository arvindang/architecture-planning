<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#243b4d">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='5' fill='%23243b4d'/%3E%3Cpath d='M7 23V12l9-5 9 5v11H7m9-16v16M7 12l9 5 9-5' fill='none' stroke='white'/%3E%3C/svg%3E">
  <title>Groundwork — architecture workspace</title>
  <link rel="stylesheet" href="styles.css">
  <link rel="stylesheet" href="site-climate.css">
  <link rel="stylesheet" href="site-viewer3d.css">
  <script src="site-evidence-data.js" defer></script>
  <script src="terrain-data.js" defer></script>
  <script src="site-constraints-data.js" defer></script>
  <script src="site-terrain.js" defer></script>
  <script src="site-evidence.js" defer></script>
  <script src="site-findings-data.js" defer></script>
  <script src="site-research.js" defer></script>
  <script src="vendor/three/three.min.js" defer></script>
  <script src="vendor/three/OrbitControls.js" defer></script>
  <script src="site3d-data.js" defer></script>
  <script src="climate-data.js" defer></script>
  <script src="site-climate.js" defer></script>
  <script src="site-viewer3d.js" defer></script>
  <script src="hydepark-site-data.js" defer></script>
  <script src="hydepark-site.js" defer></script>
  <script src="app.js" defer></script>
</head>
<body>
  <a class="skip" href="#main">Skip to workspace</a>
  <aside class="sidebar">
    <a class="brand" href="#overview"><span class="brand-mark" aria-hidden="true">⌑</span> Groundwork<span class="brand-sub">Architecture workspace</span></a>
    <label class="project-label" for="project-select">Current project</label>
    <select id="project-select"></select>
    <button class="new-project" data-action="new-project">＋ New project</button>
    <nav id="nav" aria-label="Project navigation"></nav>
    <div class="sidebar-bottom"><span class="save-dot"></span><span id="save-state" role="status">Saved in this browser</span><p>A working record, from land to living space.</p><div class="transfer"><button data-action="export">Export JSON</button><button data-action="import">Import JSON</button></div></div>
  </aside>
  <div class="workspace">
    <header class="topbar"><span>Project notebook <span class="slash">/</span> <span id="breadcrumb">Overview</span></span><button class="text-button" data-action="edit-project">Edit project brief</button></header>
    <main id="main" tabindex="-1"></main>
    <footer>Groundwork <span>Concept design workspace. Checks are recorded manually; no analysis runs automatically.</span></footer>
  </div>
  <dialog id="editor"><form id="editor-form"><div class="dialog-heading"><h2 id="dialog-title"></h2><button type="button" class="icon-button" data-action="close-dialog" aria-label="Close dialog">×</button></div><div id="dialog-fields"></div><p id="form-error" class="error" role="alert"></p><div class="dialog-actions"><button type="button" class="button secondary" data-action="close-dialog">Cancel</button><button class="button" type="submit">Save</button></div></form></dialog>
  <input id="import-file" type="file" accept="application/json,.json" hidden>
  <div id="toast" class="toast" role="status"></div>
</body>
</html>
